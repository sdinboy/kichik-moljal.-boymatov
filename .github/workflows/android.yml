name: Build Android APK with Buildozer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev libffi-dev
        sudo apt-get install -y cmake openjdk-17-jdk-headless unzip libncurses5

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools virtualenv
        pip install git+https://github.com/kivy/buildozer.git
        pip install cython

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kichik-Moljal-APK
        path: bin/*.apk
        
