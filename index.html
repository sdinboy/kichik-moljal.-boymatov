<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kichik Mo'ljal D-20</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e293b;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #0f172a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:active { background-color: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h2>D-20 Kichik Mo'ljal</h2>
    <p>Dastur interfeysi muvaffaqiyatli ishga tushdi.</p>
    <button class="btn" onclick="hisobla()">Hisoblashni boshlash</button>
</div>

<script>
    function hisobla() {
        alert("Dastur tez orada to'liq hisob-kitoblarni bajaradi!");
    }
</script>

</body>
</html>
